plugins {
    id 'java'
    id 'io.quarkus'
    id "org.sonarqube" version "7.2.2.6593"
    id 'jacoco'
//    id "com.diffplug.spotless" version "8.4.0"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation("org.mockito:mockito-core:5.20.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.20.0")

    //Redis
    implementation("io.quarkus:quarkus-redis-client")

    //Micrometer
    implementation("io.quarkus:quarkus-micrometer-registry-prometheus")

    // JSON Logging
    implementation("io.quarkus:quarkus-logging-json")

    //JSON and serialization + deserialization
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation "org.reflections:reflections:0.10.2"

    //Rest
    implementation 'io.quarkus:quarkus-rest-jackson'

    //API validation
    implementation("io.quarkus:quarkus-hibernate-validator")

    //JSON WEB TOKEN (JWT)
    implementation("io.quarkus:quarkus-smallrye-jwt")
    implementation("io.quarkus:quarkus-smallrye-jwt-build")

    //Websocket
    implementation("io.quarkus:quarkus-websockets-next")

    //Lombok
    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    //OpenApi
    implementation 'io.quarkus:quarkus-smallrye-openapi'

    //Test coverage
    testImplementation("io.quarkus:quarkus-jacoco")
}

group = 'dk.mathiaskofod'
version = '1.0.0'

sonar {
    properties {
        property "sonar.projectKey", "beeracademy-backend"
        property "sonar.organization", "mathias"
    }
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    jvmArgs "--add-opens", "java.base/java.lang=ALL-UNNAMED"
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }.absolutePath}"
}
test {
    finalizedBy jacocoTestReport
    jacoco {
        excludeClassLoaders = ["*QuarkusClassLoader"]
        destinationFile = layout.buildDirectory.file("jacoco-quarkus.exec").get().asFile
    }
}

jacocoTestReport {
    executionData.setFrom(layout.buildDirectory.file("jacoco-quarkus.exec"))
    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml")
    }
}

//Deploy tasks
tasks.register('dockerBuild', Exec) {
    group = 'deployment'
    description = 'Build Docker image'

    commandLine 'docker', 'build',
            '-f', 'src/main/docker/Dockerfile.jvm',
            '-t', 'ghcr.io/mathias-m-k/beer-academy-backend',
            '.'
}

tasks.register('dockerPush', Exec) {
    group = 'deployment'
    description = 'Push Docker image'
    dependsOn dockerBuild

    commandLine 'docker', 'push', 'ghcr.io/mathias-m-k/beer-academy-backend:latest'
}

tasks.register('k8sDeploy', Exec) {
    group = 'deployment'
    description = 'Deploy to Kubernetes'
    dependsOn dockerPush

    commandLine 'kubectl', 'apply', '-f', '../deployment/backend'
}

tasks.register('k8sForceDeploy', Exec) {
    group = 'deployment'
    description = 'Deploy to Kubernetes'
    dependsOn dockerPush

    commandLine 'kubectl', 'rollout', 'restart', 'deployment/beer-academy-backend-deployment', '-n', 'beer-academy'
}

tasks.register('manual_deploy') {
    group = 'deployment'
    description = 'Full deployment: clean, build, docker build/push, k8s deploy'
    dependsOn clean, build, k8sDeploy, k8sForceDeploy

    build.mustRunAfter clean
    dockerBuild.mustRunAfter build
}

