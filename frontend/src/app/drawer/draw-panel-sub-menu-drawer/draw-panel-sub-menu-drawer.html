<drawer-default-header [title]="segmentOptions[selectedOption()]" subtitle="Statistik"></drawer-default-header>
<segmented-control [segments]="segmentOptions"
                   [(currentSelectedOption)]="selectedOption"
                   (currentSelectedOptionChange)="onSegmentSelected()"></segmented-control>
<div id="view" #scroller
     (pointerdown)="onPointerDown()"
     (scroll)="onScroll()"
     (scrollend)="onScrollEnd()">
  <div #viewElement>View 1</div>
  <div #viewElement>View 2</div>
</div>
