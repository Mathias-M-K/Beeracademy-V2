<drawer-default-header
  [title]="segmentOptions[selectedOption()]"
  subtitle="Statistik"
></drawer-default-header>
<segmented-control
  [segments]="segmentOptions"
  [(currentSelectedOption)]="selectedOption"
></segmented-control>
<div id="view" swipePager [(selectedPage)]="selectedOption">
  <div swipePage>
    <app-round-history></app-round-history>
  </div>

  <div swipePage>
    <app-card-chance-overview></app-card-chance-overview>
  </div>
</div>
