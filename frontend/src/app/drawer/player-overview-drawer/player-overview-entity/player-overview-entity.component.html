<div class="header">
  <div>
    <p class="name">{{ player().name }}</p>
    <p class="status">{{ connectionStatus() }}</p>
  </div>

  @if (isConnected()) {
    <button class="btn-secondary" (click)="disconnectOrRelease.emit()">Fjern</button>
  } @else if (isClaimed()) {
    <button class="btn-secondary-outlined" (click)="disconnectOrRelease.emit()">Frigiv</button>
  }
</div>

<div class="chips">
  <div class="chip">
    <p>{{ player().sipsInABeer }} sips i en øl</p>
  </div>
  <div class="chip">
    <p>{{ canDrawAceText() }}</p>
  </div>
</div>
