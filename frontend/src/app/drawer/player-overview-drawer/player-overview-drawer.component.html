<app-drawer-header
  title="Deltagere"
  subtitle="2 anmodninger venter"
  (closeClick)="closeOverview()">

</app-drawer-header>

<div class="players">
  @for (player of gameService.players(); track player.id){
    <app-player-overview-entity
      [player]="player"
      [compact]="isCompact()"
      (disconnectOrRelease)="onDisconnectOrRelease(player)">
    </app-player-overview-entity>
  }
</div>
