@if (!isBackside()) {
  <div>
    <h1>{{card()?.rank??'?'}}</h1>
  </div>

  <div>
    @let suit = card()?.suit;
    @if (suit) {
      <suit-icon [suit]="suit" [size]="50"></suit-icon>
    } @else {
      <h3>?</h3>
    }

  </div>

  <div>
    <h1>{{card()?.rank??'?'}}</h1>
  </div>
} @else {
  <h3>Træk et kort</h3>
}
