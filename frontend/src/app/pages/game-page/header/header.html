<div id="left">
  <h2>{{gameInfo()?.name}}</h2>
  <p>Runde <span>4</span></p>
  <p>Spillere <span>12</span></p>
</div>

<div id="center"></div>

<div id="right">
  <p>{{gameTime() | gameTimeFormat: 'HH:mm:ss'}}</p>

  @if (timerState() === TimerState.Paused) {
    <button class="btn-tertiary btn-icon" (click)="resumeClick.emit()">▶</button>
  } @else if (timerState() === TimerState.NotStarted) {
    <button (click)="startClick.emit()">Start!</button>
  } @else {
    <button class="btn-tertiary btn-icon" (click)="pauseClick.emit()">⏸</button>
  }

  <button class="btn-secondary">Del</button>
</div>
