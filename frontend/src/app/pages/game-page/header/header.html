<div id="left">
  <h1>{{ gameInfo()?.name }}</h1>
  <p>Runde <span>{{ currentRound() }}/13</span></p>
  <p>Spillere <span>{{ nrOfPlayers() }}</span></p>
</div>

<div id="right">
  <h3 [style.grid-area]="'clock'">{{ gameTime() | gameTimeFormat: 'HH:mm:ss' }}</h3>

  <div *isGameOwner [style.grid-area]="'time-btn'">
    @if (timerState() === TimerState.Paused) {
      <button class="btn-secondary-outlined btn-icon" (click)="resumeClick.emit()">
        <material-icon icon="play_arrow"></material-icon>
      </button>
    } @else if (timerState() === TimerState.NotStarted) {
      <button class="btn-secondary-outlined btn-icon" [disabled]="true">
        <material-icon icon="pause"></material-icon>
      </button>
    } @else {
      <button class="btn-secondary-outlined btn-icon" (click)="pauseClick.emit()">
        <material-icon icon="pause"></material-icon>
      </button>
    }
  </div>

  <button
    [style.grid-area]="'player-overview-btn'"
    class="btn-secondary-outlined btn-icon" (click)="playerOverviewClick.emit()">
    <material-icon icon="group"></material-icon>
  </button>

  <button [style.grid-area]="'share-btn'" class="btn-secondary btn-icon" (click)="shareClick.emit()">
    <material-icon icon="share"></material-icon>
  </button>
</div>
