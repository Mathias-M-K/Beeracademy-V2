
<app-header style="grid-area: header"
            [gameInfo]="gameInfo()"
            [gameTime]="formattedGameTime()??0"
            [timerState]="timerState()??TimerState.NotStarted"
            (startClick)="startGame()"
            (pauseClick)="pauseGame()"
            (resumeClick)="resumeGame()">
</app-header>

<app-card-count style="grid-area: card-count" [cards]="remainingCardsCount()" [maxCardsPrRank]="players().length"></app-card-count>

<app-draw-panel id="draw-panel" style="grid-area: draw-panel"
                (drawCardClick)="drawCard()"
                [currentCard]="currentCard()"
                [currentPlayerTime]="formattedPlayerTime()??0"
                [currentPlayer]="currentPlayer()">
</app-draw-panel>

<app-podium style="grid-area: podium" [players]="players()"></app-podium>

<app-player-grid style="grid-area: players" [players]="players()"></app-player-grid>
