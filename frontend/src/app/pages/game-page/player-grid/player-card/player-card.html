<div class="header">
  <h2 [style.grid-area]="'name'">{{ player().name }}</h2>
  <p [style.grid-area]="'title'" class="subtitle">{{ player().color }}</p>
  <p [style.grid-area]="'status'" class="status">TUR</p>
</div>

<div class="main-stat">

  <div class="beer-count">
    <p><span>{{ displayedBeerCount().toFixed(1) }}</span><span class="subtitle"> øl</span></p>
  </div>

  <div class="beer-indicator">
    @for (dot of beerDots(); track $index) {
      <app-beer-dot
        [foregroundColor]="player().color"
        [fill]="dot.fillLevel"
        animate.enter="dot-enter">
      </app-beer-dot>
    }
  </div>

  <p class="subtitle">{{ displayedSipsLeft() }} tåre tilbage</p>
</div>

<div class="last-card">
  <p class="subtitle">Sidste kort trykket</p>
  <div>
    <suit-icon [suit]="lastCard()?.suit!"></suit-icon>
    <p> {{ lastCard()?.rank }}</p>
  </div>

</div>

<div class="horizontal_line"></div>
