<div id="header">
  <div class="dot"></div>
  <h4>{{ player().name }}</h4>
</div>

<div id="center">
  <app-beer-bottle [fillLevel]="sipsLeftInBeerAsPercentage()">{{sipsLeftInBeer()}}</app-beer-bottle>
  <p>{{sipsLeftInBeerAsPercentage().toFixed(1)}}</p>
  <div class="player-stats">
    <div>
      <p class="upper_subtitle">Øl</p>
      <h1>{{ beers().toFixed(1) }}</h1>

    </div>
    <div>
      <div>
        <p class="upper_subtitle">Sips</p>
        <h3>{{ totalSips() }}</h3>
      </div>
      <div>
        <p class="upper_subtitle">Snit</p>
        <h3>{{ sipsAvg() }}</h3>
      </div>
      <div>
        <p class="upper_subtitle">Sidst</p>
        <h3>{{ lastCard()?.rank }}</h3>
      </div>
    </div>

  </div>
</div>

<div id="bottom">
  <div class="horizontal_line"></div>
  <div class="beer-rack">
    @for (_ of beersConsumed; track $index) {
      <app-beer-bottle class="beer"></app-beer-bottle>
    }
  </div>

</div>
