@let isClaimed = participant().session.isClaimed;
@let isConnected = participant().session.isConnected;

<div class="dot"></div>

<div>
  <h4 style="margin: 0">{{ participant().name }}</h4>
  <p>{{ statusText() }}</p>
</div>


@if (!isConnected) {
  @let btnText = isClaimed ? 'Anmod' : 'Deltag';
  <button
    (click)="isClaimed ? requestRelease.emit(participant()) : connect.emit(participant())"
    [class.btn-primary-outlined]="isClaimed"
    [class.btn-secondary]="!isClaimed">{{ btnText }}</button>
}
