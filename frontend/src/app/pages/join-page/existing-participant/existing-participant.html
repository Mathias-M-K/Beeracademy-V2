

@let isClaimed = participant().session.isClaimed;
@let lockIcon = isClaimed ? 'lock' : 'lock_open';
<p [class.locked]="isClaimed">{{participant().name}}</p>
<material-icon [class.locked]="isClaimed" [icon]="lockIcon"></material-icon>

@let isConnected = participant().session.isConnected;
@let connectedIcon = isConnected ? 'wifi' : 'wifi_off';
<material-icon [class.connected]="isConnected" [class.disconnected]="isClaimed && !isConnected" [icon]="connectedIcon"></material-icon>
