<div class="content">
  <h1>
    <div>BEER</div>
    <div>ACADEMY</div>
  </h1>

  <div>
    <span>Du er ved at deltage i</span>
    <h1>{{ lobbyName() }}</h1>
    <span>{{alreadyJoined()}} er allerede med</span>
  </div>


  <div>
    <div id="input">
      <span>dit navn</span>
      <input placeholder="fx. Anders" [value]="participantName()" (input)="participantName.set($any($event.target).value)" aria-label="participant name">
    </div>
    <button (click)="getParticipantToken(participantName())" [disabled]="!nameOk()">Deltag</button>
  </div>

</div>
