<app-participant-badge class="badge"
                       [initials]="participantNameShort()"
                       [isActive]="participant().active!"
                       [reaction]="emojiReaction()">
</app-participant-badge>
<div>
  <h3>{{participant().name}}</h3>
  <p class="header_subtitle">{{participant().title}} • {{participant().sipsInABeer}} slurke i en øl • {{participant().canDrawAce ? 'Kan trække es' : 'Kan IKKE trække es'}}</p>
</div>

<div class="btn-row">
  @if (inLineEditing()) {
    <button class="btn-secondary" (click)="editSettings.emit(participant())">🔧</button>
    <button class="btn-secondary" (click)="remove.emit(participant().id!)">X</button>
  }
</div>
