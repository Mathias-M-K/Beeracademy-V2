<app-participant-badge class="badge"
                       [initials]="participantNameShort()"
                       [isActive]="participant().active!"
                       [reaction]="emojiReaction()">
</app-participant-badge>
<div>
  <h3>{{participant().name}}</h3>
  <p class="header_subtitle">{{participant().title}} • {{participant().sipsInABeer}} slurke i en øl</p>
</div>

<div class="btn-row">
  <button class="btn-secondary" (click)="console.log('I dont do anything')">🔧</button>
  @if (canBeRemoved()) {
    <button class="btn-secondary" (click)="remove.emit(participant().id!)">X</button>
  }
</div>
