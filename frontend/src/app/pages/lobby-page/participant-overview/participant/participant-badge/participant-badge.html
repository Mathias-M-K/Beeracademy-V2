<h3>{{ initials() }}</h3>
@if (style() === 'active' || style() === 'reserved'){
  <div [class.active]="style() === 'active'" [class.reserved]="style() === 'reserved'" class="status-indicator"></div>
}
<div class="emoji-clip" [class.emoji-active]="showEmoji()">
  <div class="emoji">{{ emoji() }}</div>
</div>
