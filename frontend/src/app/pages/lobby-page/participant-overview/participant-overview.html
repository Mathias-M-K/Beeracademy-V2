
<div style="grid-area: header" class="header">
  <h3 style="grid-area: count">Deltagere - {{participants().length}}</h3>
  @if (isLobbyOwner()) {
    <button style="grid-area: add-btn" class="btn-secondary" (click)="addParticipant.emit('matty')">+ Tilføj deltager</button>
  }
  @if (participants().length) {
    <div style="grid-area: line" class="horizontal_line">Deltagere</div>
  }
</div>

<div class="participants" style="grid-area: participants">
  @for (participant of participants(); track participant.id){
    <app-participant
      [participant]="participant"
      [participantNameShort]="participant.name!.substring(0,3).toUpperCase()"
      [canBeRemoved]="isLobbyOwner()"
      (remove)="removeParticipant.emit($event)" ></app-participant>
  }
</div>
