<p class="header_subtitle" style="grid-area: header">Lobbykode</p>


<h2 style="grid-area: id">{{ lobbyId() | mask : 'AAA-AAA-AAA' }}</h2>

<div class="buttons" style="grid-area: copy-btn">
  <button class="btn-tertiary btn-icon" (click)="qrBtnClick.emit()">
    <material-icon icon="qr_code"></material-icon>
  </button>
  <button class="btn-tertiary btn-icon" [cdkCopyToClipboard]="lobbyJoinLink()">
    <material-icon icon="content_copy"></material-icon>
  </button>
</div>
