@if (lobbyService.title() && lobbyService.websocketConnectionStatus() === ConnectionStatus.CONNECTED) {
  <div class="header" style="grid-area: header">
    <div>
      <h1>{{ lobbyService.title() }}</h1>
      <p class="header_subtitle">Du er {{ lobbyService.readableRole() }}</p>
    </div>

    <app-lobby-info-quick [lobbyId]="lobbyService.lobbyId() ?? ''"></app-lobby-info-quick>
  </div>


  <app-participant-overview style="grid-area: participant-list"
                            [participants]="lobbyService.participants()"
                            [isLobbyOwner]="lobbyService.role() === Role.GameClient"
                            (addParticipant)="onAddParticipant($event)"
                            (removeParticipant)="onRemoveParticipant($event)"
                            (disconnect)="lobbyService.leaveLobby()"></app-participant-overview>

  <app-chat style="grid-area: chat"></app-chat>
} @else {
  <h2>{{ lobbyService.websocketConnectionStatus() }}</h2>
}
