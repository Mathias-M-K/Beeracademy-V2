@if (lobbyService.title()){
  <div class="header" style="grid-area: header">
    <h1>{{ lobbyService.title() }} - {{lobbyService.lobbyId()}}</h1>
    <p class="header_subtitle">Du er {{lobbyService.role()}}</p>
  </div>
  <div style="grid-area: participant-list">
    <app-participant-overview
      [participants]="lobbyService.participants()"
      [isLobbyOwner]="lobbyService.role() === Role.GameClient"
      (addParticipant)="onAddPlayer($event)"></app-participant-overview>
  </div>
  <div style="grid-area: chat">
    <h1>Chat</h1>
  </div>
}
