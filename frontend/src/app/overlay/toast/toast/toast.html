<div class="icon-backdrop" [style.grid-area]="'icon'">

</div>


<h4 [style.grid-area]="'title'">{{ toastData().title }}</h4>
<p [style.grid-area]="'msg'">{{ toastData().message }}</p>


<div class="timer-bar"></div>
