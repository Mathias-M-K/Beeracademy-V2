name: Build and Deploy
run-name: Deploy of ${{ github.ref_name }} triggered by ${{ github.event_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/mathias-m-k/beer-academy-backend
  FRONTEND_IMAGE: ghcr.io/mathias-m-k/beer-academy-frontend
  NAMESPACE: beer-academy
  OPENAPI_ARTIFACT: openapi-spec

jobs:

  verify-ci:
    name: Verify CI Passed
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Wait for CI on this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const deadline = Date.now() + 15 * 60 * 1000;

            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: context.sha, event: 'push', per_page: 100,
              });

              const latestPerWorkflow = new Map();
              for (const run of runs.filter(r => /(backend|frontend)-ci\.yml$/.test(r.path))) {
                const previous = latestPerWorkflow.get(run.path);
                if (!previous || new Date(run.created_at) > new Date(previous.created_at)) {
                  latestPerWorkflow.set(run.path, run);
                }
              }
              const ciRuns = [...latestPerWorkflow.values()];

              if (ciRuns.length === 0) {
                core.warning(`No CI runs found for ${context.sha}; deploying without a CI check.`);
                return;
              }

              const failed = ciRuns.filter(r => r.status === 'completed' && !['success', 'skipped'].includes(r.conclusion));
              if (failed.length > 0) {
                core.setFailed(`CI did not pass for ${context.sha}: ${failed.map(r => `${r.name} (${r.conclusion}) ${r.html_url}`).join(', ')}`);
                return;
              }

              const pending = ciRuns.filter(r => r.status !== 'completed');
              if (pending.length === 0) {
                core.info(`CI passed: ${ciRuns.map(r => r.name).join(', ')}`);
                return;
              }

              if (Date.now() > deadline) {
                core.setFailed(`Timed out waiting for CI: ${pending.map(r => r.name).join(', ')}`);
                return;
              }

              core.info(`Waiting for CI: ${pending.map(r => r.name).join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, 20000));
            }

  backend:
    name: Build Backend Image
    needs: verify-ci
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-disabled: true

      - name: Build with Gradle
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew quarkusBuild -x test

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.OPENAPI_ARTIFACT }}
          path: backend/build/generated-openapi/openapi.json

      - name: Log in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./backend
          file: ./backend/src/main/docker/Dockerfile.jvm
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:latest

  frontend:
    name: Build Frontend Image
    needs: backend
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download OpenAPI spec
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.OPENAPI_ARTIFACT }}
          path: ./frontend/openapi-spec/

      - name: Log in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./frontend
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: Deploy to MicroK8s
    needs: [ backend, frontend ]
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Set new images
        run: |
          microk8s.kubectl set image deployment/beer-academy-backend-deployment beer-academy-backend-container=${{ env.BACKEND_IMAGE }}:${{ github.ref_name }} -n ${{ env.NAMESPACE }}
          microk8s.kubectl set image deployment/beer-academy-frontend-deployment beer-academy-frontend-container=${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }} -n ${{ env.NAMESPACE }}

      - name: Wait for rollouts
        id: rollout
        run: |
          microk8s.kubectl rollout status deployment/beer-academy-backend-deployment -n ${{ env.NAMESPACE }} --timeout=5m &
          backend_pid=$!
          microk8s.kubectl rollout status deployment/beer-academy-frontend-deployment -n ${{ env.NAMESPACE }} --timeout=5m &
          frontend_pid=$!

          wait $backend_pid
          wait $frontend_pid

      - name: Roll back on failed rollout
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          microk8s.kubectl rollout undo deployment/beer-academy-backend-deployment -n ${{ env.NAMESPACE }}
          microk8s.kubectl rollout undo deployment/beer-academy-frontend-deployment -n ${{ env.NAMESPACE }}

  release:
    name: Create GitHub Release
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create release with generated notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            try {
              await github.rest.repos.createRelease({ owner, repo, tag_name: tag, generate_release_notes: true });
            } catch (error) {
              if (error.status !== 422) throw error;
              core.warning(`Release for ${tag} already exists.`);
            }
