version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      quarkus:
        patterns:
          - 'io.quarkus*'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular*'
    ignore:
      - dependency-name: '@angular*'
        update-types: [ 'version-update:semver-major' ]
      - dependency-name: typescript
        update-types: [ 'version-update:semver-major' ]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend/src/main/docker
    schedule:
      interval: weekly
