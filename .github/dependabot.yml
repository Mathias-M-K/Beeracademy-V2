version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: [ '*' ]
        update-types: [ minor, patch ]
    ignore:
      - dependency-name: '*'
        update-types: [ 'version-update:semver-major' ]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      backend:
        patterns: [ '*' ]
        update-types: [ minor, patch ]
    ignore:
      - dependency-name: '*'
        update-types: [ 'version-update:semver-major' ]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: [ '*' ]
        update-types: [ minor, patch ]
    ignore:
      - dependency-name: '*'
        update-types: [ 'version-update:semver-major' ]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: [ 'version-update:semver-major' ]

  - package-ecosystem: docker
    directory: /backend/src/main/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: [ 'version-update:semver-major' ]
